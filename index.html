daggerPose=function(t,a){const N={dx:0,dy:0,dz:0,rx:0,ry:0,rz:0};let R=N,Lh=N,spin=0,lift=0,tw=0;

  case 1:if(a<0.5)R=handMove("punch",a*2);else Lh=handMove("punch",a*2-1);break;
  case 2:R=handMove("lunge",a);break;
  case 3:{const i=Math.min(2,Math.floor(a*3)),b=a*3-i;if(i===0)R=handMove("punch",b);else if(i===1)Lh=handMove("punch",b);else{R=handMove(P.special?"lunge":"punch",b);if(P.special)Lh=handMove("lunge",b);}break;}
  case 4:R=handMove(P.special?"lunge":"punch",a);if(P.special)Lh=handMove("lunge",a);break;
  case 5:if(P.special){const i=Math.min(3,Math.floor(a*4)),b=a*4-i;if(i%2)Lh=handMove("punch",b);else R=handMove("punch",b);spin=i*Math.PI/2+(b>0.6?(b-0.6)/0.4*Math.PI/2:0);}else R=handMove("punch",a);break;

const wImg=(k,t,cls="wim")=>`<img class="${cls}" src="${WIMG[k][t]}" alt="">`;
function withW(k,f){const e=EQ,w=WEAP;EQ=k;WEAP=WSTATE[k];try{return f();}finally{EQ=e;WEAP=w;}}
renderDet=function(){let d=invUI.querySelector(".det");if(!INV_DET){if(d)d.remove();return;}if(!d){d=document.createElement("div");d.className="det";invUI.appendChild(d);}
 const k=INV_DET,s=WSTATE[k],c=TIER_COL[s.tier],A=k==="staff"?STAFF_ATK[s.tier]:WATK[k],max=s.tier===6&&s.lvl>=100,cd=withW(k,()=>atkCd());
 const tiers=TIER_NAMES.map((nm,i)=>`<span style="background:${TIER_COL[i]};opacity:${i<=s.tier?1:0.28}" title="${nm}">${i+1}</span>`).join("");
 const rows=[["Hasar",weapDamage(k)],["Menzil",A.range+" m"],["Kritik şansı","%"+((k==="dagger"?25:15)+ST_crit()*100).toFixed(1)],["Kritik hasarı",ST_cm().toFixed(1)+"×"],["Saldırı aralığı",cd.toFixed(2)+" sn"],["Silah seviyesi",s.lvl+(max?" (MAKS)":" / 100")]];
 d.innerHTML=`<div class="dp" style="border-color:${c}"><i class="dx">✕</i><div class="dtop"><div class="pic" style="border-color:${c};box-shadow:0 0 16px ${c}66,inset 0 0 24px ${c}33">${wImg(k,s.tier,"big")}</div>
  <div class="dmeta"><div class="nm" style="color:${c}">${weapName(k)}</div><small>${TIER_NAMES[s.tier]} · Kademe ${s.tier+1}/7</small><div class="bar"><i style="width:${max?100:s.lvl}%;background:${c}"></i></div><div class="st">Sv ${s.lvl}${max?" · MAKS":" / 100"}</div>
  ${k===EQ?'<div class="eqtag">✓ Kuşanıldı</div>':""}</div></div>
  <div class="srows">${rows.map(r=>`<div><span>${r[0]}</span><b>${r[1]}</b></div>`).join("")}</div>
  <div class="sk">✦ ${SKILLS[k][s.tier].n}<small>${SKILLS[k][s.tier].d}</small></div>
  <div class="sec">Kademeler</div><div class="tiers">${tiers}</div>
  ${k===EQ?'<div class="go dis">Kuşanıldı</div>':'<div class="go">Kuşan</div>'}
  <div class="tst"><u class="t1">Test: kademe +1</u><u class="t2">Test: tüm silahlar</u></div></div>`;
 d.onpointerdown=e=>{if(e.target===d){INV_DET=null;d.remove();}};
 d.querySelector(".dx").onclick=()=>{INV_DET=null;d.remove();};
 const go=d.querySelector(".go:not(.dis)");if(go)go.onclick=()=>{equip(k);showOff();renderInv();};
 d.querySelector(".t1").onclick=()=>{const was=EQ;equip(k);WEAP.tier=(WEAP.tier+1)%7;WEAP.lvl=1;saveWeap();updWeapUI();if(was!==k)equip(was);renderInv();if(k===EQ){tierUpFX();showOff();}};
 d.querySelector(".t2").onclick=()=>{for(const q in CHEST.own)CHEST.own[q]=true;saveChest();renderInv();};};

 const taskRow=(q,v,got,i,w)=>{const ok=v>=q.n;return`<div class="dt"><div class="tt"><b>${q.t}</b><div class="bar"><i style="width:${v/q.n*100}%"></i></div><small>${q.k==="secs"?Math.floor(v/60)+" / "+q.n/60+" dk":fmtN(v)+" / "+fmtN(q.n)}</small></div>
   <b class="cl ${got?"got":ok?"":"off"}" data-i="${i}" data-w="${w?1:0}">${got?"Alındı ✓":`<i class="cn"></i>${fmtN(q.g*m)}`}</b></div>`;};
 if(DT==="lg"){const n=DAILY.lg.n%7,rdy=loginReady();
  body=`<div class="d7">${LOGIN_G.map((g,i)=>{const st=i<n?"got":i===n&&rdy?"now":"";return`<div class="dd ${st} ${i===6?"big":""}"><small>${i+1}. Gün</small><i class="cn"></i><b>${fmtN(g*m)}</b>${st==="got"?'<em>✓</em>':""}</div>`;}).join("")}</div>
   <b class="go ${rdy?"":"off"}">${rdy?"Ödülü al":"Yarın yeni ödül"}</b><p class="note">Her gün giriş yap, 7. günün ödülü en büyüğü.</p>`;}
 else if(DT==="wk")body=`<div class="dts">${WTASK.map((q,i)=>taskRow(q,wVal(q),WEEK.got[i],i,true)).join("")}</div><p class="note">Haftalık görevler her pazartesi yenilenir.</p>`;
 else body=`<div class="dts">${DTASK.map((q,i)=>taskRow(q,taskVal(q),DAILY.got[i],i,false)).join("")}</div><p class="note">Günlük görevler her gün yenilenir.</p>`;
 const dotW=WTASK.some((q,i)=>!WEEK.got[i]&&wVal(q)>=q.n),dotD=DTASK.some((q,i)=>!DAILY.got[i]&&taskVal(q)>=q.n);
 const sub=[["lg","Giriş",loginReady()],["gt","Günlük",dotD],["wk","Haftalık",dotW]].map(([kk,nn,dot])=>`<b class="tb ${DT===kk?"on":""}" data-d="${kk}">${nn}${dot?'<i class="dot"></i>':""}</b>`).join("");
 shell("dly","Görev ve ödüller",sub,body);
 PAN.dly.querySelectorAll("[data-d]").forEach(el=>el.onclick=()=>{DT=el.dataset.d;renderPanel("dly");});
 const go=PAN.dly.querySelector(".go");if(go)go.onclick=()=>{if(!loginReady())return;const g=LOGIN_G[DAILY.lg.n%7]*m;DAILY.lg.n++;DAILY.lg.last=today();saveDaily();WEEK.logins++;saveWeek();vib(40);
  flyGold(go,g,()=>{updDot();});renderPanel("dly");};
 PAN.dly.querySelectorAll(".cl").forEach(el=>el.onclick=()=>{const i=+el.dataset.i,w=el.dataset.w==="1",q=(w?WTASK:DTASK)[i],got=w?WEEK.got:DAILY.got;
  if(got[i]||(w?wVal(q):taskVal(q))<q.n)return;got[i]=true;w?saveWeek():saveDaily();vib(40);const g=q.g*m;flyGold(el,g,()=>updDot());
  el.className="cl got";el.textContent="Alındı ✓";setTimeout(()=>{if(UIP.k==="dly")renderPanel("dly");},700);});};
// the daily window opens on whichever tab has something waiting
{const oST=setTab;setTab=function(k){if(k==="dly"&&UIP.k!=="dly"){dailyCheck();weekCheck();if(loginReady())DT="lg";else if(DTASK.some((q,i)=>!DAILY.got[i]&&taskVal(q)>=q.n))DT="gt";else if(WTASK.some((q,i)=>!WEEK.got[i]&&wVal(q)>=q.n))DT="wk";}return oST(k);};}

// ---- starter chest: opened once, all four weapons come out; tap to see each ----
let SREV=null;
sRev.addEventListener("pointerdown",e=>{if(!SREV)return;e.stopImmediatePropagation();e.preventDefault();SREV.i++;if(SREV.i>=SREV.list.length){SREV=null;sRev.classList.remove("show");return;}showRev();},true);
function showRev(){const k=SREV.list[SREV.i],s=WSTATE[k],c=TIER_COL[s.tier],n=SREV.list.length,last=SREV.i===n-1;
 sRev.innerHTML=`<div class="rc" style="border-color:${c};box-shadow:0 0 30px ${c}66"><small>Sandıktan çıktı · ${SREV.i+1}/${n}</small><div class="pic">${wImg(k,s.tier,"big")}</div><b style="color:${c}">${weapName(k)}</b><span>${k===EQ?"Eline aldın":"Envantere eklendi"}</span>
  <div class="dots">${SREV.list.map((_,j)=>`<i class="${j<=SREV.i?"on":""}"></i>`).join("")}</div>${last?"<em>Tüm silahlar senin! Kahraman menüsünden değiştirebilirsin.</em>":""}<div class="nx">${last?"Kapatmak için dokun":"Sonraki silah için dokun ›"}</div></div>`;
 sRev.classList.remove("show");void sRev.offsetWidth;sRev.classList.add("show");vib(25);
 fxSparks(SCH?SCH.x:P.x,0.9,SCH?SCH.z:P.z,10,"255,205,70",4);}
openStarter=function(){if(!SCH)return;const list=SORDER.filter(k=>!CHEST.own[k]);if(!list.length)return;
 for(const k of list)CHEST.own[k]=true;saveChest();if(!HASW()||list.includes("staff"))equip(list.includes("staff")?"staff":list[0]);
 FX.push({k:"pillar",x:SCH.x,y:0,z:SCH.z,t:0,life:1.1,r:1.1});FX.push({k:"ring",x:SCH.x,y:0.05,z:SCH.z,t:0,life:1.1,r0:0.5,r1:5,col:"255,214,110"});
 fxSparks(SCH.x,0.6,SCH.z,30,"255,205,70",6);SHAKE=Math.max(SHAKE,0.2);vib(50);
 clearTimeout(openStarter.t);SREV={list,i:0};showRev();};

// ---- bosses: embers, bigger, harder (hp/size set where they spawn) ----
let embT=0;
function bossFX(dt){embT+=dt;if(embT<0.12)return;embT=0;
 for(const e of ENEMIES){if(!(e.boss||e.tg)||e.state==="dead"||e.rise>0)continue;if(Math.hypot(e.x-P.x,e.z-P.z)>22)continue;
  const col=e.boss?"255,120,50":"200,130,255",sc=e.sc||2;
  for(let k=0;k<2;k++){const a=Math.random()*6.283,r=0.4+Math.random()*0.9*sc*0.5;FX.push({k:"spark",up:true,x:e.x+Math.cos(a)*r,y:0.2+Math.random()*0.8,z:e.z+Math.sin(a)*r,vx:(Math.random()-0.5)*0.3,vy:0.9+Math.random()*1.2,vz:(Math.random()-0.5)*0.3,t:0,life:0.7+Math.random()*0.5,col});}
  if(e.atk>0&&e.atk<0.6&&Math.random()<0.5)fxSparks(e.x,1.2*sc*0.5,e.z,3,col,3);}}
fxEnemyStrike=(function(o){return function(e){o(e);if(e.boss||e.tg){SHAKE=Math.max(SHAKE,0.28);FX.push({k:"ring",x:e.x,y:0.05,z:e.z,t:0,life:0.55,r0:0.4,r1:2.4*(e.sc||2)/2,col:e.boss?"255,110,60":"200,130,255"});}};})(fxEnemyStrike);
{let lt=performance.now();(function bt(){requestAnimationFrame(bt);const t=performance.now(),dt=Math.min(0.05,(t-lt)/1000);lt=t;if(!window.__uip&&!invOpen&&!modalOpen&&MAP)bossFX(dt);})();}
// boss bar sits just under the top HUD so it never covers the quest box
setInterval(()=>{const b=topEl.getBoundingClientRect().bottom;bossEl.style.top=Math.round(b+10)+"px";},300);
window.__dbg={get E(){return ENEMIES;},P,get MAP(){return MAP;},get CURR(){return CURR;}};
}
