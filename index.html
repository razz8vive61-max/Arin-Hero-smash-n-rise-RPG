function invItems(){return Object.keys(WNAME).filter(k=>CHEST.own[k]).map(k=>({k,type:"weapon"}));}
const invHero=renderInv;
renderInv=function(){invHero();if(invTab!=="w")return;
 const tb=invUI.querySelector('.tb[data-t="w"]');if(tb)tb.textContent="Envanter";
 const items=invItems(),n=items.length,slots=Math.max(20,Math.ceil(n/5)*5);let cells="";
 for(let i=0;i<slots;i++){const it=items[i];if(!it){cells+='<div class="cell"></div>';continue;}const s=WSTATE[it.k],c=TIER_COL[s.tier],pct=s.tier===6&&s.lvl>=100?100:s.lvl;
  cells+=`<div class="cell it" data-k="${it.k}" style="border-color:${c};box-shadow:inset 0 0 12px ${c}55">${wImg(it.k,s.tier)}<b style="background:${c}">${s.tier+1}</b>${it.k===EQ?'<em>✓</em>':''}<i class="lb"><i style="width:${pct}%;background:${c}"></i></i></div>`;}
 invUI.querySelector(".bd").innerHTML=`<div class="grid">${cells}</div><p class="note">${n} eşya · Envanter doldukça yeni satırlar kendiliğinden açılır.</p>`;
 invUI.querySelectorAll(".cell.it").forEach(el=>el.onclick=()=>{INV_DET=el.dataset.k;renderDet();});
 if(INV_DET)renderDet();};
function renderDet(){let d=invUI.querySelector(".det");if(!INV_DET){if(d)d.remove();return;}if(!d){d=document.createElement("div");d.className="det";invUI.appendChild(d);}
 const k=INV_DET,s=WSTATE[k],c=TIER_COL[s.tier],A=k==="staff"?STAFF_ATK[s.tier]:WATK[k],max=s.tier===6&&s.lvl>=100;
 const tiers=TIER_NAMES.map((nm,i)=>`<span style="background:${TIER_COL[i]};opacity:${i<=s.tier?1:0.28}" title="${nm}">${i+1}</span>`).join("");
 d.innerHTML=`<div class="dp" style="border-color:${c}"><div class="dh"><div class="ic" style="border-color:${c};box-shadow:0 0 12px ${c}88">${wIcon(k,c)}</div><div><div class="nm" style="color:${c}">${weapName(k)}</div><small>${TIER_NAMES[s.tier]} · Kademe ${s.tier+1}/7</small></div><i class="dx">✕</i></div>
  <div class="bar"><i style="width:${max?100:s.lvl}%;background:${c}"></i></div><div class="st">Sv ${s.lvl}${max?" · MAKS":" / 100"}</div>
  <div class="rows"><div><span>Hasar</span><b>${weapDamage(k)}</b></div><div><span>Menzil</span><b>${A.range} m</b></div></div>
  <div class="sk">✦ ${SKILLS[k][s.tier].n}<small>${SKILLS[k][s.tier].d}</small></div>
  <div class="sec">Kademeler</div><div class="tiers">${tiers}</div>
  ${k===EQ?'<div class="go dis">Kuşanıldı</div>':'<div class="go">Kuşan</div>'}
  <div class="tst"><u class="t1">Test: kademe +1</u><u class="t2">Test: tüm silahlar</u></div></div>`;
 d.onpointerdown=e=>{if(e.target===d){INV_DET=null;d.remove();}};
 d.querySelector(".dx").onclick=()=>{INV_DET=null;d.remove();};
 const go=d.querySelector(".go:not(.dis)");if(go)go.onclick=()=>{equip(k);renderInv();};
 d.querySelector(".t1").onclick=()=>{const was=EQ;equip(k);WEAP.tier=(WEAP.tier+1)%7;WEAP.lvl=1;saveWeap();updWeapUI();if(was!==k)equip(was);renderInv();if(k===EQ)tierUpFX();};
 d.querySelector(".t2").onclick=()=>{for(const q in CHEST.own)CHEST.own[q]=true;saveChest();renderInv();};}
const closeInvBase=closeInv;closeInv=function(){INV_DET=null;closeInvBase();};
PT.face.po=true;
